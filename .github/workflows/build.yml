name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    # ESLint reads the types of the galata tests from ui-tests/node_modules.
    - name: Install the dependencies of the galata tests
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install ".[test,models]"

        pytest -vv -r ap --cov whybook
        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "whybook.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "whybook.*OK"
        python -m jupyterlab.browser_check

    - name: Check that all endpoints are authenticated
      run: |
        set -eux
        python .github/scripts/check_auth.py

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "whybook" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v7
      with:
        name: extension-artifacts
        path: dist/whybook*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" whybook*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "whybook.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "whybook.*OK"
        python -m jupyterlab.browser_check --no-browser-test

        # This job has no checkout, so the demo's files can come only from the wheel.
        python -m whybook.demo "$RUNNER_TEMP/whybook-demo"

  integration-tests:
    name: Integration tests (${{ matrix.shard }}/${{ matrix.shards }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      # The other shards go on when one fails, so that the report has every
      # failure of the run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shards: [4]

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v8
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        # --group needs pip 25.1.
        python -m pip install -U "pip>=25.1"
        python -m pip install "jupyterlab>=4.0.0,<5" "$(ls whybook*.whl)[demo,kernel,plots]"
        python -m pip install --group ui-tests

    - name: Install bubblewrap for the sandboxed kernel
      run: |
        set -eux
        # The later demo is saved with "Python 3 (sandboxed)". Ubuntu 24.04
        # lets AppArmor refuse unprivileged user namespaces, which bwrap needs.
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Set up browser cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    - name: Install browser
      run: |
        set -eux
        jlpm playwright install chromium --only-shell
      working-directory: ui-tests

    # Each shard writes a blob report, and the next job merges them into one
    # HTML report.
    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=github,blob

    - name: Upload the blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: whybook-playwright-blob-${{ matrix.shard }}
        path: ui-tests/blob-report
        retention-days: 1
        compression-level: 1

  integration-tests-report:
    name: Integration tests report
    needs: integration-tests
    # The report is needed most when a shard fails. After a failed build no
    # shard runs, and there is no report to merge.
    if: ${{ !cancelled() && needs.integration-tests.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install jlpm
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Install the dependencies of the galata tests
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Download the blob reports
      uses: actions/download-artifact@v8
      with:
        pattern: whybook-playwright-blob-*
        path: ui-tests/all-blob-reports
        merge-multiple: true

    - name: Merge the blob reports
      working-directory: ui-tests
      run: jlpm playwright merge-reports --reporter=html all-blob-reports

    - name: Upload Playwright Test report
      uses: actions/upload-artifact@v7
      with:
        name: whybook-playwright-tests
        path: ui-tests/playwright-report

    # The report as one HTML file, with its screenshots and videos in it. The
    # link in the job summary opens it in the browser.
    - name: Inline the report
      uses: jupyterlab/maintainer-tools/.github/actions/inline-playwright-report@v1
      with:
        path: ui-tests/playwright-report
        output: ui-tests/whybook-playwright-report.html

    - name: Upload the inlined report
      id: upload-report
      uses: actions/upload-artifact@v7
      with:
        path: ui-tests/whybook-playwright-report.html
        archive: false

    - name: Link the report in the job summary
      env:
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
      run: echo "**[Open the Playwright report](${REPORT_URL})**" >> "$GITHUB_STEP_SUMMARY"

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          # INFORMS answers 403 to scripts; its DOIs open in a browser.
          # Cloudflare's bot protection answers 403 to the runner at whybook.dev.
          # YouTube answers 429 to the runner at times.
          ignore_links: 'https://doi.org/10.1287/.* https://whybook.dev.* https://www.youtube.com/.*'
