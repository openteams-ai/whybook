# a mybinder.org-ready environment for demoing whybook
# this environment may also be used locally on Linux/MacOS/Windows, e.g.
#
#   conda env update --file binder/environment.yml
#   conda activate whybook-demo
#
name: whybook-demo

channels:
  - conda-forge

dependencies:
  # runtime dependencies
  - python >=3.14,<3.15
  - jupyterlab >=4.6.0,<5
  - pip
  - pip:
      # The release from PyPI, not a build of this checkout: no Node.js, and a
      # faster build each time a new commit invalidates the image.
      - whybook[demo,kernel,plots]
